# Compression modules (ABI-matched to the alpine nginx package).
load_module modules/ngx_http_brotli_filter_module.so;
load_module modules/ngx_http_brotli_static_module.so;
load_module modules/ngx_http_zstd_filter_module.so;
load_module modules/ngx_http_zstd_static_module.so;

worker_processes auto;
pid /run/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;
    server_tokens      off;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # gzip fallback for clients that support neither brotli nor zstd.
    gzip            on;
    gzip_vary       on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types      text/plain text/css application/javascript application/json
                    application/xml application/rss+xml application/atom+xml
                    application/manifest+json image/svg+xml font/ttf font/otf;

    brotli            on;
    brotli_comp_level 6;
    brotli_min_length 256;
    brotli_types      text/plain text/css application/javascript application/json
                      application/xml application/rss+xml application/atom+xml
                      application/manifest+json image/svg+xml font/ttf font/otf;

    zstd            on;
    zstd_comp_level 9;
    zstd_min_length 256;
    zstd_types      text/plain text/css application/javascript application/json
                    application/xml application/rss+xml application/atom+xml
                    application/manifest+json image/svg+xml font/ttf font/otf;

    include /etc/nginx/conf.d/*.conf;
}
