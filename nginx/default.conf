server {
    listen      80;
    server_name _;
    root        /usr/share/nginx/html;
    index       index.html;

    # Hugo/Hextra fingerprint CSS, JS and fonts with a content hash in the
    # filename, so a changed file always gets a new URL. Cache them forever.
    location ~* \.(css|js|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Images and icons referenced from the docs keep stable filenames, so they
    # must stay revalidatable — otherwise replacing one in place would leave
    # visitors on the old version until the cache expires.
    location ~* \.(png|jpe?g|gif|svg|ico|webp|avif)$ {
        add_header Cache-Control "public, max-age=86400, must-revalidate";
    }

    # HTML always revalidates so content edits ship on the next request.
    location / {
        try_files  $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache";
    }
}
